name: Update POT file

on:
  push:
    branches: [dev]
    paths:
      - "**/*.php"
      - "**/*.js"
  workflow_dispatch:

jobs:
  jobs:
    update-pot-file:
      uses: pressbooks/reusable-workflows/.github/workflows/update-pot.yml@main
      secrets: inherit
      with:
        domain: 'pressbooks-aldine'
        slug: 'pressbooks-aldine'
        package_name: 'Aldine'
        headers: '{"Report-Msgid-Bugs-To": "https://github.com/pressbooks/pressbooks-aldine/issues"}'
